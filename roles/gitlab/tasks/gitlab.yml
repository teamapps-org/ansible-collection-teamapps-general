# gitlab tasks

- name: Verify dedicated registry storage is mounted
  assert:
    that:
      - gitlab_registry_path in (ansible_facts.mounts | map(attribute='mount'))
    fail_msg: >-
      Refusing to configure GitLab because {{ gitlab_registry_path }} is not a
      mounted filesystem. Restore the registry mount before continuing.
  when: gitlab_registry_require_mount | bool

- name: Create GitLab systemd override directory
  file:
    path: /etc/systemd/system/gitlab-runsvdir.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: gitlab_registry_require_mount | bool

- name: Bind GitLab service lifecycle to registry mount
  copy:
    content: |
      [Unit]
      RequiresMountsFor={{ gitlab_registry_path }}
    dest: /etc/systemd/system/gitlab-runsvdir.service.d/registry-mount.conf
    owner: root
    group: root
    mode: '0644'
  notify: gitlab reload systemd
  when: gitlab_registry_require_mount | bool

- name: configure gitlab apt repository
  import_tasks: repository.yml

- name: Install latest package version
  # Package scripts can run reconfigure and report secret-bearing Ruby errors.
  no_log: true
  apt:
    name: gitlab-ce
  when: gitlab_version == "latest"

- name: Install specific package version
  no_log: true
  apt:
    name: gitlab-ce={{ gitlab_version }}
  when: gitlab_version != "latest"

- name: setup gitlab pages
  import_tasks: pages.yml
  when: gitlab_pages_enable | bool

- name: install restricted gitlab configuration
  no_log: true
  template:
    src: 'ansible-{{ item }}.rb.j2'
    dest: '/etc/gitlab/ansible-{{ item }}.rb'
    owner: root
    group: root
    mode: '0600'
  loop:
    - smtp
    - pages
    - custom
  notify: gitlab-ctl reconfigure

- name: install gitlab.rb config file
  template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: '0600'
  notify: gitlab-ctl reconfigure

- name: Gitlab backup config
  lineinfile:
    path: /usr/local/bin/prebackup.sh
    line: 'gitlab-backup create BACKUP=auto GZIP_RSYNCABLE=yes CRON=1 SKIP={{ gitlab_backup_skip }}'
    regex: '^gitlab'

- name: cronjob for gitlab registry garbage collect # noqa args
  cron:
    name: gitlab-registry-garbage-collect
    minute: "25"
    hour: "04"
    day: "{{ gitlab_registry_garbage_collect_cron_day }}"
    user: root
    job: '/usr/bin/gitlab-ctl registry-garbage-collect {{ gitlab_registry_garbage_collect_options }}'
    cron_file: registry_garbage_collect
    state: '{{ gitlab_registry_garbage_collect_state }}'

- name: gitlab custom robots.txt directory
  file:
    path: /srv/gitlab-nginx
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: gitlab_custom_robots_txt

- name: deploy custom robots.txt
  template:
    src: robots.txt.j2
    dest: /srv/gitlab-nginx/robots.txt
    owner: root
    group: root
    mode: '0644'
  when: gitlab_custom_robots_txt
