---
- name: create file_sd directory
  file:
    path: "{{ victoriametrics_path }}/file_sd"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: create scrape_configs directory
  file:
    path: "{{ victoriametrics_path }}/scrape_configs"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: create file discovery configuration
  copy:
    content: |
      #
      # Managed by ansible
      #
      {{ item.config | teamapps.general.to_nice_yaml(indent=2) }}
    dest: "{{ victoriametrics_path }}/file_sd/{{ item.name | default('custom') }}.{{ item.job }}.yml"
    owner: root
    group: root
    mode: '0640'
  loop: '{{ victoriametrics_file_sd_config }}'

- name: find file discovery configurations
  find:
    paths: "{{ victoriametrics_path }}/file_sd"
    patterns: '*.yml'
  register: victoriametrics_file_sd_existing

# prometheus.yml.j2 renders optional jobs from victoriametrics_file_sd_config, so a file it does not list must not exist
- name: remove file discovery configurations not in victoriametrics_file_sd_config
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ victoriametrics_file_sd_existing.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: item.path | basename not in victoriametrics_file_sd_managed
  vars:
    victoriametrics_file_sd_managed: >-
      {{ victoriametrics_file_sd_config | map(attribute='name', default='custom')
         | zip(victoriametrics_file_sd_config | map(attribute='job'))
         | map('join', '.') | map('regex_replace', '$', '.yml') | list }}

- name: deploy vmagent config file prometheus.yml
  template:
    src: 'prometheus.yml.j2'
    dest: '{{ victoriametrics_path }}/prometheus.yml'
    owner: root
    group: root
    mode: '0640'
  notify: victoriametrics-vmagent-restart

# validation in the template won't work because %s expansion won't be reachable from within the container
- name: vmagent validate config
  command: 'docker compose run --rm -T vmagent -dryRun -promscrape.config=/etc/prometheus/prometheus.yml -remoteWrite.url=http://victoriametrics:8428/api/v1/write'
  args:
    chdir: "{{ victoriametrics_path }}" # to run docker compose in the correct directory
  changed_when: false
