- name: nexus_directories
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  with_items:
    - '{{ nexus_path }}'

- name: nexus_data directory
  file:
    path: "{{ nexus_path }}/data"
    state: directory
    owner: '200'
    group: '200'
    mode: '0750'

- name: nexus secrets key file
  when: nexus_secrets_keys | length > 0
  block:
    - name: assert nexus_secrets_active_key references a configured key
      assert:
        that:
          - nexus_secrets_active_key in (nexus_secrets_keys | map(attribute='id') | list)
        fail_msg: 'nexus_secrets_active_key must be one of the ids in nexus_secrets_keys'
        quiet: true

    - name: nexus_secrets directory
      file:
        path: '{{ nexus_path }}/secrets'
        state: directory
        owner: '200'
        group: '200'
        mode: '0700'

    - name: deploy nexus_secrets.json
      template:
        src: 'nexus_secrets.json'
        dest: '{{ nexus_path }}/secrets/nexus_secrets.json'
        owner: '200'
        group: '200'
        mode: '0400'
      no_log: true
      notify: nexus_restart

- name: deploy docker-compose.yml
  template:
    src: 'docker-compose.yml'
    dest: '{{ nexus_path }}/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'

- name: nexus_docker-compose-up
  community.docker.docker_compose_v2:
    project_src: '{{ nexus_path }}'
    state: present
    pull: "{{ nexus_docker_pull | ternary('always', 'policy') }}"
  register: nexus__register_compose
  tags: compose_up

- name: print actions by compose # noqa no-handler
  vars:
    actions: "{{ nexus__register_compose.actions }}"
  debug:
    var: actions
  changed_when: true
  when: nexus__register_compose is defined and nexus__register_compose.changed
