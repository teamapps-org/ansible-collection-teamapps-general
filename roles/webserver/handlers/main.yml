---
- name: webserver_restart
  no_log: true
  community.docker.docker_compose_v2:
    project_src: '{{ webserver_path }}'
    state: restarted
  tags: compose_up

- name: webserver_restart_nginx
  no_log: true
  community.docker.docker_compose_v2:
    project_src: '{{ webserver_path }}'
    services:
      - web
    state: restarted
  tags: compose_up

- name: webserver_restart_php
  no_log: true
  community.docker.docker_compose_v2:
    project_src: '{{ webserver_path }}'
    services:
      - php
    build: 'always'
    state: restarted
  tags: compose_up

- name: webserver_recreate_sftp
  no_log: true
  community.docker.docker_compose_v2:
    project_src: '{{ webserver_path }}'
    services:
      - sftp
    state: restarted
  tags: compose_up
