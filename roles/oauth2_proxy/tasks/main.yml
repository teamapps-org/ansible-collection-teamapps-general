# tasks for oauth2 proxy

- name: validate oauth2_proxy_trusted_proxy_ips
  assert:
    that:
      - oauth2_proxy_trusted_proxy_ips is sequence
      - oauth2_proxy_trusted_proxy_ips is not string
      - oauth2_proxy_trusted_proxy_ips is not mapping
      - oauth2_proxy_trusted_proxy_ips | reject('string') | list | length == 0
    fail_msg: >-
      oauth2_proxy_trusted_proxy_ips must be a list of IP addresses or CIDR ranges,
      for example ['172.28.0.0/16'], not {{ oauth2_proxy_trusted_proxy_ips | to_json }}.
    quiet: true
  tags:
    - oauth2_proxy_instance

- name: manage oauth2_proxy instances
  no_log: true
  loop: '{{ oauth2_proxy_instances | default([]) }}'
  loop_control:
    loop_var: instance
    label: '{{ instance.domain }}'
  vars:
    oauth2_proxy_instance_domain: "{{ instance.domain }}"
    oauth2_proxy_instance_standalone: "{{ instance.standalone | default(False) }}"
    oauth2_proxy_instance_htpasswd: "{{ instance.htpasswd | default('') }}"
    oauth2_proxy_instance_cookie_secret: "{{ instance.cookie_secret }}"
    oauth2_proxy_instance_cookie_refresh: "{{ instance.cookie_refresh | default(oauth2_proxy_cookie_refresh) }}"
    oauth2_proxy_instance_cookie_domain: "{{ instance.cookie_domain | default(oauth2_proxy_instance_domain) }}"
    oauth2_proxy_instance_cookie_name: "{{ instance.cookie_name | default('_oauth2_' + oauth2_proxy_instance_domain) | regex_replace('[^a-z0-9]', '_') }}"
    oauth2_proxy_instance_host: "{{ instance.host | default('oauth2-proxy.' + oauth2_proxy_instance_domain) }}"
    oauth2_proxy_instance_directory: "{{ instance.directory | default('/container/oauth2_' + oauth2_proxy_instance_domain) }}"
    oauth2_proxy_instance_session_store_type: "{{ instance.session_store_type | default('cookie') }}"
    oauth2_proxy_instance_redis_persistence_enabled: "{{ instance.redis_persistence_enabled | default(true) }}"
    oauth2_proxy_instance_redis_data_directory: "{{ instance.redis_data_directory | default(oauth2_proxy_instance_directory + '/redis-data') }}"
    oauth2_proxy_instance_provider: "{{ instance.provider | default('gitlab') }}"
    oauth2_proxy_instance_gitlab_url: "{{ instance.gitlab_url | default('') }}"
    oauth2_proxy_instance_oidc_issuer_url: "{{ instance.oidc_issuer_url | default((instance.entra_id_tenant_id is defined) | ternary('https://login.microsoftonline.com/' + (instance.entra_id_tenant_id | default('')) + '/v2.0', '')) }}"
    oauth2_proxy_instance_client_id: "{{ instance.client_id }}"
    oauth2_proxy_instance_client_secret: "{{ instance.client_secret | default('') }}"
    oauth2_proxy_instance_whitelist_domains: "{{ instance.whitelist_domains | default([]) }}"
    oauth2_proxy_instance_email_domains: "{{ instance.email_domains | default([]) }}"
    oauth2_proxy_instance_authenticated_emails: "{{ instance.authenticated_emails | default([]) }}"
    oauth2_proxy_instance_gitlab_groups: "{{ instance.gitlab_groups | default([]) }}"
    oauth2_proxy_instance_allowed_groups: "{{ instance.allowed_groups | default([]) }}"
    oauth2_proxy_instance_oidc_groups_claim: "{{ instance.oidc_groups_claim | default('') }}"
    oauth2_proxy_instance_scope: "{{ instance.scope | default('openid') }}"
    oauth2_proxy_instance_entra_id_allowed_tenants: "{{ instance.entra_id_allowed_tenants | default([]) }}"
    oauth2_proxy_instance_insecure_oidc_skip_issuer_verification: "{{ instance.insecure_oidc_skip_issuer_verification | default(false) }}"
    oauth2_proxy_instance_entra_id_federated_token_auth: "{{ instance.entra_id_federated_token_auth | default(false) }}"
    oauth2_proxy_instance_additional_config: "{{ instance.additional_config | default('') }}"
    oauth2_proxy_instance_internal_host: true
    oauth2_proxy_instance_webproxy_integration: "{{ instance.webproxy_integration | default(not oauth2_proxy_instance_standalone) }}"
    # oauth2_proxy_webproxy_config_vhost_directory: "{{ instance.vhost_directory | default( oauth2_proxy_webproxy_path + '/data/vhost.d') }}"
    oauth2_proxy_webproxy_config_custom_vhost: "{{ instance.custom_vhost | default('') }}"
    oauth2_proxy_webproxy_config_custom_vhost_location: "{{ instance.custom_vhost_location | default('') }}"
  include_tasks:
    file: instance.yml
    apply:
      tags:
        - oauth2_proxy
        - oauth2_proxy_instance
  tags:
    - oauth2_proxy
    - oauth2_proxy_instance

- name: manage webproxy config for oauth2 proxy integration
  loop: '{{ oauth2_proxy_webproxy_sso_configs | default([]) }}'
  loop_control:
    loop_var: instance
  vars:
    oauth2_proxy_instance_domain: "{{ instance.service_domain }}"
    oauth2_proxy_instance_host: "{{ instance.oauth2_proxy_host }}"
    oauth2_proxy_instance_internal_host: "{{ instance.internal_host | default(False) }}"
    oauth2_proxy_instance_cookie_name: "{{ instance.cookie_name }}"
    # oauth2_proxy_webproxy_config_vhost_directory: "{{ instance.vhost_directory | default( oauth2_proxy_webproxy_path + '/data/vhost.d') }}"
    oauth2_proxy_webproxy_config_custom_vhost: "{{ instance.custom_vhost | default('') }}"
    oauth2_proxy_webproxy_config_custom_vhost_location: "{{ instance.custom_vhost_location | default('') }}"
  include_tasks:
    file: webproxy_config.yml
    apply:
      tags:
        - oauth2_proxy
        - oauth2_proxy_webproxy_config
  tags:
    - oauth2_proxy
    - oauth2_proxy_webproxy_config

# The nginx auth cache was removed (see README). Older deployments still have its cache zone.
# nginx does not start when a proxy_cache names an unknown zone, so the zone stays until no
# vhost.d file uses it. Such files can come from another play or from outside this role.
- name: find webproxy vhost configs that still use the oauth2 cache zone
  command:
    argv:
      - grep
      - -rlE
      - '^\s*proxy_cache\s+oauth2_cache'
      - '{{ oauth2_proxy_webproxy_path }}/data/vhost.d'
  register: oauth2_proxy_cache_zone_users
  changed_when: false
  failed_when: oauth2_proxy_cache_zone_users.rc not in [0, 1]
  check_mode: false

- name: remove unused oauth2 proxy_cache conf from webproxy
  file:
    path: '{{ oauth2_proxy_webproxy_path }}/data/conf.d/oauth2_proxy_cache.conf'
    state: absent
  when: oauth2_proxy_cache_zone_users.stdout == ''
  notify: oauth2_proxy_regenerate_webproxy_config
