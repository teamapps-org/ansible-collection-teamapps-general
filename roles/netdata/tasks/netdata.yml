---
# tasks file for netdata installs netdata on host and proxies requests to webproxy

- name: configure netdata apt repository
  import_tasks: repository.yml

- name: install netdata
  apt:
    name: netdata
    state: present

- name: add user netdata to docker group
  user:
    name: netdata
    shell: /usr/sbin/nologin
    groups: [docker]
    append: true
  notify: netdata_restart
  when: netdata_docker_integration

- name: deploy netdata config
  template:
    src: netdata.conf
    dest: /etc/netdata/netdata.conf
    owner: root
    group: 'netdata'
    mode: '0640'
  notify: netdata_restart

- name: deploy stream config
  no_log: true
  template:
    src: stream.conf
    dest: /etc/netdata/stream.conf
    owner: root
    group: 'netdata'
    mode: '0640'
  notify: netdata_restart

- name: ensure /etc/netdata/go.d exists
  file:
    path: "/etc/netdata/go.d"
    state: directory
    owner: root
    group: netdata
    mode: '0755'

- name: configure docker metrics collection
  template:
    src: go.d/docker.conf
    dest: /etc/netdata/go.d/docker.conf
    owner: root
    group: netdata
    mode: '0644'
  notify: netdata_restart

# go.d logs the full DSN when a check fails. The password goes to a pgpass
# file so the DSN has none.
- name: check that postgres jobs with password key have no inline password
  assert:
    that: netdata__postgres_inline_password_jobs | length == 0
    fail_msg: >-
      netdata_postgres_jobs: remove the password from dsn of
      {{ netdata__postgres_inline_password_jobs | join(', ') }}
    quiet: true
  vars:
    netdata__postgres_inline_password_jobs: >-
      {{ netdata_postgres_jobs | selectattr('password', 'defined')
      | selectattr('dsn', 'match', '^postgres(ql)?://[^/@]*:[^/@]*@')
      | map(attribute='name') | list }}
  when: netdata_postgres_enabled | bool

- name: create postgres pgpass directory
  file:
    path: /etc/netdata/pgpass.d
    state: directory
    owner: root
    group: netdata
    mode: '0750'

- name: deploy postgres pgpass files
  no_log: true
  template:
    src: pgpass.j2
    dest: '/etc/netdata/pgpass.d/{{ item.name }}'
    owner: root
    group: netdata
    mode: '0640'
  loop: '{{ netdata_postgres_jobs | selectattr("password", "defined") | list }}'
  notify: netdata_restart
  when: netdata_postgres_enabled | bool

- name: find postgres pgpass files
  find:
    paths: /etc/netdata/pgpass.d
    file_type: file
  register: netdata__register_pgpass_files

- name: remove stale postgres pgpass files
  file:
    path: '{{ item.path }}'
    state: absent
  loop: '{{ netdata__register_pgpass_files.files }}'
  loop_control:
    label: '{{ item.path }}'
  notify: netdata_restart
  when: >-
    not netdata_postgres_enabled | bool
    or item.path | basename not in
    netdata_postgres_jobs | selectattr('password', 'defined') | map(attribute='name') | list

- name: deploy postgres monitoring configuration
  no_log: true
  template:
    src: postgres.conf.j2
    dest: /etc/netdata/go.d/postgres.conf
    owner: root
    group: netdata
    mode: '0640'
  notify: netdata_restart
  when: netdata_postgres_enabled

- name: check for cloud
  stat:
    path: /var/lib/netdata/cloud.d/
  register: netdata_cloud_stat

- name: notify old cloud
  debug:
    msg: Is netdata package up to date?
  when: not netdata_cloud_stat.stat.isdir is defined or not netdata_cloud_stat.stat.isdir

- name: disable cloud
  template:
    src: cloud.conf
    dest: /var/lib/netdata/cloud.d/cloud.conf
    owner: netdata
    group: netdata
    mode: '0640'
  when: netdata_cloud_stat.stat.isdir is defined and netdata_cloud_stat.stat.isdir
  notify: netdata_restart

- name: disable/enable telemetry  # noqa args
  file:
    path: /etc/netdata/.opt-out-from-anonymous-statistics
    state: "{{ netdata_disable_telemetry | ternary('touch', 'absent') }}"
    access_time: preserve
    modification_time: preserve
    owner: root
    group: netdata
    mode: '0644'
  notify: netdata_restart

- name: alarm sending configuration
  no_log: true
  template:
    src: health_alarm_notify.conf
    dest: /etc/netdata/health_alarm_notify.conf
    owner: root
    group: netdata
    mode: '0640'
  notify: netdata_restart

- name: start netdata service
  systemd:
    service: netdata
    state: started
    enabled: true

- name: restart netdata service now if needed
  meta: flush_handlers

# netdata.conf sends every log to the journal, so files left in
# /var/log/netdata are old. Runs after the restart, when netdata no longer writes there.
- name: remove old netdata log files
  block:
    - name: find old netdata log files
      find:
        paths: /var/log/netdata
        file_type: file
      register: netdata__register_old_logs

    - name: remove old netdata log files
      file:
        path: '{{ item.path }}'
        state: absent
      loop: '{{ netdata__register_old_logs.files }}'
      loop_control:
        label: '{{ item.path }}'

- name: Import tasks for netdata-docker integration
  import_tasks: docker.yml
  when: netdata_docker_integration

- name: Import tasks for netdata alarms
  import_tasks: alarms.yml
  tags: netdata_alarms
