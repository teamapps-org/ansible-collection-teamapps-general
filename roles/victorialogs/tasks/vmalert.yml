---


- name: create rules directory
  file:
    path: "{{ victorialogs_path }}/rules"
    state: directory
    owner: root
    group: root
    mode: '0755'

# https://github.com/victorialogs/victorialogs/blob/master/deployment/docker/README.md#alerts
- name: alerting rules file
  template:
    src: "rules/{{ item }}.j2"
    dest: "{{ victorialogs_path }}/rules/{{ item }}"
    owner: root
    group: root
    mode: '0640'
  with_items:
    - vlog-alert.rules.yml
  notify:
    - vmalert reload
    - vmalert validate config

- name: manage canary recording rules file
  template:
    src: rules/vlcanary.rules.yml.j2
    dest: '{{ victorialogs_path }}/rules/vlcanary.rules.yml'
    owner: root
    group: root
    mode: '0640'
  when: victorialogs_canary_recording_rules_enabled | bool
  notify:
    - vmalert reload
    - vmalert validate config
  tags:
    - victorialogs_canary

- name: remove disabled canary recording rules file
  file:
    path: '{{ victorialogs_path }}/rules/vlcanary.rules.yml'
    state: absent
  when: not (victorialogs_canary_recording_rules_enabled | bool)
  notify:
    - vmalert reload
    - vmalert validate config
  tags:
    - victorialogs_canary

- name: copy alerting rule files
  copy:
    src: "{{ item }}"
    dest: "{{ victorialogs_path }}/rules/"
    owner: root
    group: root
    mode: '0640'
  with_fileglob:
    - "rules/*.rules.yml"
  notify:
    - vmalert reload
    - vmalert validate config

# validation in the template won't work because %s expansion won't be reachable from within the container
- name: vmalert validate config
  command: docker compose run --rm -T vmalert -dryRun -rule=/etc/alerts/*.yml
  args:
    chdir: "{{ victorialogs_path }}" # to run docker compose in the correct directory
  changed_when: false
...
